<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>かずをかぞえよう</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
        }
        .game-container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 700px;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        .object-display {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            min-height: 200px;
            margin: 30px 0;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 15px;
        }
        .object {
            font-size: 60px;
            animation: appear 0.3s ease-in-out;
        }
        @keyframes appear {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }
        .number-buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-top: 20px;
        }
        .number-btn {
            padding: 20px;
            font-size: 2em;
            font-weight: bold;
            border: 3px solid #333;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        .number-btn:hover {
            background: #e3f2fd;
            transform: scale(1.05);
        }
        .number-btn:active {
            transform: scale(0.95);
        }
        .message {
            font-size: 1.8em;
            margin-top: 20px;
            height: 40px;
        }
        .correct {
            color: #4CAF50;
            animation: bounce 0.5s;
        }
        .wrong {
            color: #f44336;
            animation: shake 0.5s;
        }
        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        .score {
            font-size: 1.5em;
            margin-top: 20px;
            color: #666;
        }
        .question {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>かずをかぞえよう🔢</h1>
        <div class="question" id="question"></div>
        <div class="object-display" id="objectDisplay"></div>
        <div class="number-buttons">
            <button class="number-btn" onclick="checkAnswer(1)">1</button>
            <button class="number-btn" onclick="checkAnswer(2)">2</button>
            <button class="number-btn" onclick="checkAnswer(3)">3</button>
            <button class="number-btn" onclick="checkAnswer(4)">4</button>
            <button class="number-btn" onclick="checkAnswer(5)">5</button>
            <button class="number-btn" onclick="checkAnswer(6)">6</button>
            <button class="number-btn" onclick="checkAnswer(7)">7</button>
            <button class="number-btn" onclick="checkAnswer(8)">8</button>
            <button class="number-btn" onclick="checkAnswer(9)">9</button>
            <button class="number-btn" onclick="checkAnswer(10)">10</button>
        </div>
        <div class="message" id="message"></div>
        <div class="score">せいかい: <span id="score">0</span></div>
    </div>

    <script>
        const objects = [
            { emoji: '🍎', name: 'りんご' },
            { emoji: '🍌', name: 'バナナ' },
            { emoji: '🍓', name: 'いちご' },
            { emoji: '🌸', name: 'はな' },
            { emoji: '⭐', name: 'ほし' },
            { emoji: '🚗', name: 'くるま' },
            { emoji: '🎈', name: 'ふうせん' },
            { emoji: '🦋', name: 'ちょうちょ' },
            { emoji: '🐠', name: 'さかな' },
            { emoji: '🍪', name: 'クッキー' }
        ];
        
        let currentObject;
        let currentCount;
        let score = 0;
        let audioContext;
        
        // 音声コンテキストの初期化
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        
        // ファンファーレ効果音を再生
        function playFanfare() {
            if (!audioContext) return;
            
            // ファンファーレのメロディ（ド・ミ・ソ・ド）
            const notes = [
                { freq: 523.25, time: 0 },      // C5
                { freq: 659.25, time: 0.15 },   // E5
                { freq: 783.99, time: 0.3 },    // G5
                { freq: 1046.50, time: 0.45 }   // C6
            ];
            
            notes.forEach(note => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(note.freq, audioContext.currentTime + note.time);
                
                gainNode.gain.setValueAtTime(0, audioContext.currentTime + note.time);
                gainNode.gain.linearRampToValueAtTime(0.3, audioContext.currentTime + note.time + 0.05);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + note.time + 0.4);
                
                oscillator.start(audioContext.currentTime + note.time);
                oscillator.stop(audioContext.currentTime + note.time + 0.4);
            });
            
            // 和音でハーモニーを追加
            setTimeout(() => {
                const chordNotes = [523.25, 659.25, 783.99]; // C, E, G
                chordNotes.forEach(freq => {
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    oscillator.type = 'triangle';
                    oscillator.frequency.setValueAtTime(freq, audioContext.currentTime);
                    
                    gainNode.gain.setValueAtTime(0.15, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.6);
                    
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.6);
                });
            }, 600);
        }
        
        function newRound() {
            currentObject = objects[Math.floor(Math.random() * objects.length)];
            currentCount = Math.floor(Math.random() * 10) + 1;
            
            document.getElementById('question').textContent = `${currentObject.name}は いくつ？`;
            
            const display = document.getElementById('objectDisplay');
            display.innerHTML = '';
            
            for (let i = 0; i < currentCount; i++) {
                setTimeout(() => {
                    const obj = document.createElement('div');
                    obj.className = 'object';
                    obj.textContent = currentObject.emoji;
                    display.appendChild(obj);
                }, i * 100);
            }
            
            document.getElementById('message').textContent = '';
            document.getElementById('message').className = 'message';
        }
        
        function checkAnswer(answer) {
            const messageEl = document.getElementById('message');
            
            if (answer === currentCount) {
                messageEl.textContent = 'せいかい！🎉';
                messageEl.className = 'message correct';
                score++;
                document.getElementById('score').textContent = score;
                
                // ファンファーレを再生
                playFanfare();
                
                setTimeout(() => {
                    newRound();
                }, 1500);
            } else {
                messageEl.textContent = 'もういちど かぞえてみよう！';
                messageEl.className = 'message wrong';
            }
        }
        
        // ゲーム開始
        initAudio();
        newRound();
    </script>
</body>
</html>
