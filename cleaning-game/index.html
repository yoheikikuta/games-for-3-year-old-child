<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>おかたづけゲーム</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #87CEEB;
        }
        
        .game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .room {
            width: 800px;
            height: 600px;
            background: #FFF8DC;
            position: relative;
            border: 5px solid #8B7355;
            border-radius: 20px;
            overflow: hidden;
        }
        
        .floor {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 200px;
            background: #DEB887;
            border-top: 3px solid #D2691E;
        }
        
        .wall {
            position: absolute;
            top: 0;
            width: 100%;
            height: 400px;
            background: #FFE4B5;
        }
        
        .window {
            position: absolute;
            top: 50px;
            left: 100px;
            width: 150px;
            height: 150px;
            background: #87CEEB;
            border: 8px solid #8B4513;
            border-radius: 10px;
        }
        
        .bookshelf {
            position: absolute;
            right: 50px;
            top: 100px;
            width: 200px;
            height: 250px;
            background: #8B4513;
            border: 3px solid #654321;
            border-radius: 5px;
        }
        
        .shelf {
            position: absolute;
            width: 180px;
            height: 5px;
            background: #654321;
            left: 10px;
        }
        
        .shelf1 { top: 80px; }
        .shelf2 { top: 160px; }
        
        .toybox {
            position: absolute;
            left: 50px;
            bottom: 50px;
            width: 150px;
            height: 100px;
            background: #4169E1;
            border: 3px solid #0000CD;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
        }
        
        .toybox::after {
            content: '📦';
        }
        
        .trash-bin {
            position: absolute;
            right: 250px;
            bottom: 50px;
            width: 80px;
            height: 100px;
            background: #696969;
            border: 3px solid #2F4F4F;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        
        .trash-bin::after {
            content: '🗑️';
        }
        
        .item {
            position: absolute;
            cursor: grab;
            transition: transform 0.2s;
            font-size: 50px;
            z-index: 10;
        }
        
        .item:hover {
            transform: scale(1.1);
        }
        
        .item.dragging {
            cursor: grabbing;
            z-index: 100;
            opacity: 0.8;
        }
        
        .drop-zone {
            position: absolute;
            border: 3px dashed transparent;
            border-radius: 10px;
            transition: all 0.3s;
        }
        
        .drop-zone.active {
            border-color: #32CD32;
            background: rgba(50, 205, 50, 0.2);
        }
        
        .bookshelf-zone {
            right: 60px;
            top: 110px;
            width: 180px;
            height: 230px;
        }
        
        .toybox-zone {
            left: 60px;
            bottom: 60px;
            width: 130px;
            height: 80px;
        }
        
        .trash-zone {
            right: 255px;
            bottom: 55px;
            width: 70px;
            height: 90px;
        }
        
        .progress {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.5em;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 10px;
            z-index: 100;
        }
        
        .message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            z-index: 200;
        }
        
        .message h2 {
            margin: 0 0 20px 0;
            font-size: 2.5em;
            color: #333;
        }
        
        .message p {
            font-size: 1.5em;
            color: #666;
            margin: 10px 0;
        }
        
        .start-btn, .retry-btn {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 1.5em;
            background: #4ECDC4;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .start-btn:hover, .retry-btn:hover {
            background: #45B7AA;
        }
        
        .sparkle {
            position: absolute;
            font-size: 30px;
            animation: sparkle 1s ease-out forwards;
            pointer-events: none;
            z-index: 150;
        }
        
        @keyframes sparkle {
            0% {
                transform: scale(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: scale(2) rotate(360deg);
                opacity: 0;
            }
        }
        
        .celebration {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 150px;
            animation: celebrate 2s ease-out forwards;
            pointer-events: none;
            z-index: 300;
        }
        
        @keyframes celebrate {
            0% {
                transform: translate(-50%, -50%) scale(0) rotate(0deg);
                opacity: 1;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.5) rotate(180deg);
            }
            100% {
                transform: translate(-50%, -50%) scale(0) rotate(360deg);
                opacity: 0;
            }
        }
        
        .instruction {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 1.2em;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 10px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="room" id="room">
            <div class="wall">
                <div class="window"></div>
            </div>
            <div class="floor"></div>
            <div class="bookshelf">
                <div class="shelf shelf1"></div>
                <div class="shelf shelf2"></div>
            </div>
            <div class="toybox"></div>
            <div class="trash-bin"></div>
            
            <div class="drop-zone bookshelf-zone" data-type="book"></div>
            <div class="drop-zone toybox-zone" data-type="toy"></div>
            <div class="drop-zone trash-zone" data-type="trash"></div>
            
            <div class="instruction" id="instruction" style="display: none;">
                ものを ただしい ばしょに かたづけよう！
            </div>
            
            <div class="progress" id="progress" style="display: none;">
                かたづけた: <span id="cleanedCount">0</span>/<span id="totalCount">0</span>
            </div>
        </div>
        
        <div class="message" id="startMessage">
            <h2>おかたづけゲーム 🧹</h2>
            <p>ちらかった へやを</p>
            <p>きれいに かたづけよう！</p>
            <button class="start-btn" onclick="startGame()">スタート！</button>
        </div>
        
        <div class="message" id="gameOverMessage" style="display: none;">
            <h2>ぴかぴか！ ✨</h2>
            <p>へやが きれいに なったね！</p>
            <p>よく できました！</p>
            <button class="retry-btn" onclick="resetGame()">もういちど！</button>
        </div>
    </div>
    
    <script>
        let audioContext;
        let totalItems = 0;
        let cleanedItems = 0;
        let draggedItem = null;
        
        const items = [
            { emoji: '📚', type: 'book', name: 'ほん' },
            { emoji: '📖', type: 'book', name: 'えほん' },
            { emoji: '📕', type: 'book', name: 'あかいほん' },
            { emoji: '📗', type: 'book', name: 'みどりのほん' },
            { emoji: '📘', type: 'book', name: 'あおいほん' },
            { emoji: '🧸', type: 'toy', name: 'くま' },
            { emoji: '🎨', type: 'toy', name: 'えのぐ' },
            { emoji: '🏀', type: 'toy', name: 'ぼーる' },
            { emoji: '🚗', type: 'toy', name: 'くるま' },
            { emoji: '🎯', type: 'toy', name: 'だーつ' },
            { emoji: '🍌', type: 'trash', name: 'ばななのかわ' },
            { emoji: '🗞️', type: 'trash', name: 'しんぶん' },
            { emoji: '📦', type: 'trash', name: 'からばこ' }
        ];
        
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        
        function playSound(type) {
            if (!audioContext) return;
            
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            if (type === 'pickup') {
                oscillator.frequency.setValueAtTime(400, audioContext.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.1);
            } else if (type === 'correct') {
                const notes = [523.25, 659.25, 783.99];
                notes.forEach((freq, index) => {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.connect(gain);
                    gain.connect(audioContext.destination);
                    osc.frequency.setValueAtTime(freq, audioContext.currentTime + index * 0.1);
                    gain.gain.setValueAtTime(0.2, audioContext.currentTime + index * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + index * 0.1 + 0.2);
                    osc.start(audioContext.currentTime + index * 0.1);
                    osc.stop(audioContext.currentTime + index * 0.1 + 0.2);
                });
            } else if (type === 'wrong') {
                oscillator.frequency.setValueAtTime(200, audioContext.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.1);
            } else if (type === 'complete') {
                const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99];
                notes.forEach((freq, index) => {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.connect(gain);
                    gain.connect(audioContext.destination);
                    osc.frequency.setValueAtTime(freq, audioContext.currentTime + index * 0.15);
                    gain.gain.setValueAtTime(0.3, audioContext.currentTime + index * 0.15);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + index * 0.15 + 0.4);
                    osc.start(audioContext.currentTime + index * 0.15);
                    osc.stop(audioContext.currentTime + index * 0.15 + 0.4);
                });
            }
        }
        
        function createItems() {
            const room = document.getElementById('room');
            const selectedItems = [];
            
            // 各タイプから適当な数を選ぶ
            const bookItems = items.filter(item => item.type === 'book');
            const toyItems = items.filter(item => item.type === 'toy');
            const trashItems = items.filter(item => item.type === 'trash');
            
            // 本を3-4個
            for (let i = 0; i < Math.floor(Math.random() * 2) + 3; i++) {
                if (bookItems.length > 0) {
                    const index = Math.floor(Math.random() * bookItems.length);
                    selectedItems.push(bookItems[index]);
                }
            }
            
            // おもちゃを3-4個
            for (let i = 0; i < Math.floor(Math.random() * 2) + 3; i++) {
                if (toyItems.length > 0) {
                    const index = Math.floor(Math.random() * toyItems.length);
                    selectedItems.push(toyItems[index]);
                }
            }
            
            // ゴミを2-3個
            for (let i = 0; i < Math.floor(Math.random() * 2) + 2; i++) {
                if (trashItems.length > 0) {
                    const index = Math.floor(Math.random() * trashItems.length);
                    selectedItems.push(trashItems[index]);
                }
            }
            
            totalItems = selectedItems.length;
            document.getElementById('totalCount').textContent = totalItems;
            
            // アイテムを配置
            selectedItems.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'item';
                itemDiv.textContent = item.emoji;
                itemDiv.dataset.type = item.type;
                itemDiv.dataset.name = item.name;
                itemDiv.draggable = true;
                
                // ランダムな位置に配置（床の上）
                const x = Math.random() * 600 + 100;
                const y = Math.random() * 150 + 350;
                itemDiv.style.left = x + 'px';
                itemDiv.style.top = y + 'px';
                
                // ドラッグイベント
                itemDiv.addEventListener('dragstart', handleDragStart);
                itemDiv.addEventListener('dragend', handleDragEnd);
                
                // タッチイベント
                itemDiv.addEventListener('touchstart', handleTouchStart, { passive: false });
                itemDiv.addEventListener('touchmove', handleTouchMove, { passive: false });
                itemDiv.addEventListener('touchend', handleTouchEnd);
                
                room.appendChild(itemDiv);
            });
        }
        
        function handleDragStart(e) {
            draggedItem = e.target;
            e.target.classList.add('dragging');
            playSound('pickup');
            
            // ドロップゾーンを有効化
            const zones = document.querySelectorAll('.drop-zone');
            zones.forEach(zone => {
                zone.addEventListener('dragover', handleDragOver);
                zone.addEventListener('drop', handleDrop);
                zone.addEventListener('dragleave', handleDragLeave);
            });
        }
        
        function handleDragEnd(e) {
            e.target.classList.remove('dragging');
            
            // ドロップゾーンのイベントを削除
            const zones = document.querySelectorAll('.drop-zone');
            zones.forEach(zone => {
                zone.classList.remove('active');
                zone.removeEventListener('dragover', handleDragOver);
                zone.removeEventListener('drop', handleDrop);
                zone.removeEventListener('dragleave', handleDragLeave);
            });
        }
        
        function handleDragOver(e) {
            e.preventDefault();
            e.currentTarget.classList.add('active');
        }
        
        function handleDragLeave(e) {
            e.currentTarget.classList.remove('active');
        }
        
        function handleDrop(e) {
            e.preventDefault();
            const zone = e.currentTarget;
            const zoneType = zone.dataset.type;
            const itemType = draggedItem.dataset.type;
            
            if (zoneType === itemType) {
                // 正しい場所に置いた
                playSound('correct');
                createSparkle(e.clientX, e.clientY);
                draggedItem.remove();
                cleanedItems++;
                updateProgress();
                
                if (cleanedItems === totalItems) {
                    setTimeout(gameComplete, 500);
                }
            } else {
                // 間違った場所
                playSound('wrong');
                zone.classList.remove('active');
            }
        }
        
        // タッチイベントの処理
        let touchItem = null;
        let touchOffset = { x: 0, y: 0 };
        
        function handleTouchStart(e) {
            e.preventDefault();
            touchItem = e.target;
            const touch = e.touches[0];
            const rect = touchItem.getBoundingClientRect();
            touchOffset.x = touch.clientX - rect.left;
            touchOffset.y = touch.clientY - rect.top;
            touchItem.classList.add('dragging');
            playSound('pickup');
        }
        
        function handleTouchMove(e) {
            e.preventDefault();
            if (!touchItem) return;
            
            const touch = e.touches[0];
            const room = document.getElementById('room');
            const roomRect = room.getBoundingClientRect();
            
            touchItem.style.left = (touch.clientX - roomRect.left - touchOffset.x) + 'px';
            touchItem.style.top = (touch.clientY - roomRect.top - touchOffset.y) + 'px';
            
            // ドロップゾーンの検出
            const zones = document.querySelectorAll('.drop-zone');
            zones.forEach(zone => {
                const zoneRect = zone.getBoundingClientRect();
                if (touch.clientX >= zoneRect.left && touch.clientX <= zoneRect.right &&
                    touch.clientY >= zoneRect.top && touch.clientY <= zoneRect.bottom) {
                    zone.classList.add('active');
                } else {
                    zone.classList.remove('active');
                }
            });
        }
        
        function handleTouchEnd(e) {
            e.preventDefault();
            if (!touchItem) return;
            
            const touch = e.changedTouches[0];
            touchItem.classList.remove('dragging');
            
            // ドロップゾーンの検出
            const zones = document.querySelectorAll('.drop-zone');
            let dropped = false;
            
            zones.forEach(zone => {
                const zoneRect = zone.getBoundingClientRect();
                if (touch.clientX >= zoneRect.left && touch.clientX <= zoneRect.right &&
                    touch.clientY >= zoneRect.top && touch.clientY <= zoneRect.bottom) {
                    const zoneType = zone.dataset.type;
                    const itemType = touchItem.dataset.type;
                    
                    if (zoneType === itemType) {
                        // 正しい場所に置いた
                        playSound('correct');
                        createSparkle(touch.clientX, touch.clientY);
                        touchItem.remove();
                        cleanedItems++;
                        updateProgress();
                        dropped = true;
                        
                        if (cleanedItems === totalItems) {
                            setTimeout(gameComplete, 500);
                        }
                    } else {
                        // 間違った場所
                        playSound('wrong');
                    }
                }
                zone.classList.remove('active');
            });
            
            touchItem = null;
        }
        
        function createSparkle(x, y) {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.textContent = '✨';
            sparkle.style.left = x + 'px';
            sparkle.style.top = y + 'px';
            document.body.appendChild(sparkle);
            
            setTimeout(() => {
                sparkle.remove();
            }, 1000);
        }
        
        function updateProgress() {
            document.getElementById('cleanedCount').textContent = cleanedItems;
        }
        
        function gameComplete() {
            playSound('complete');
            
            const celebration = document.createElement('div');
            celebration.className = 'celebration';
            celebration.textContent = '🏠';
            document.body.appendChild(celebration);
            
            setTimeout(() => {
                celebration.remove();
                document.getElementById('gameOverMessage').style.display = 'block';
            }, 2000);
        }
        
        function startGame() {
            initAudio();
            cleanedItems = 0;
            document.getElementById('cleanedCount').textContent = cleanedItems;
            
            document.getElementById('startMessage').style.display = 'none';
            document.getElementById('instruction').style.display = 'block';
            document.getElementById('progress').style.display = 'block';
            
            createItems();
        }
        
        function resetGame() {
            cleanedItems = 0;
            totalItems = 0;
            
            // アイテムを削除
            const items = document.querySelectorAll('.item');
            items.forEach(item => item.remove());
            
            document.getElementById('gameOverMessage').style.display = 'none';
            document.getElementById('instruction').style.display = 'none';
            document.getElementById('progress').style.display = 'none';
            document.getElementById('startMessage').style.display = 'block';
        }
    </script>
</body>
</html>
