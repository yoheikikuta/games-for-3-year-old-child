<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リボンこねこタッチ</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            height: 100dvh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom, #8ed9ff 0%, #c7f2ff 46%, #b9e88d 47%, #71c769 100%);
            color: #253142;
            user-select: none;
            touch-action: none;
        }

        .game-container {
            position: relative;
            width: 100vw;
            height: 100%;
            overflow: hidden;
        }

        .sun {
            position: absolute;
            top: 24px;
            right: 38px;
            width: 82px;
            height: 82px;
            border-radius: 50%;
            background: #ffd85c;
            box-shadow: 0 0 0 12px rgba(255, 216, 92, 0.22), 0 0 35px rgba(255, 182, 39, 0.45);
        }

        .cloud {
            position: absolute;
            font-size: 58px;
            opacity: 0.85;
            animation: cloudDrift linear infinite;
            pointer-events: none;
        }

        .cloud.one {
            top: 112px;
            left: -80px;
            animation-duration: 34s;
        }

        .cloud.two {
            top: 188px;
            left: -160px;
            animation-duration: 46s;
            animation-delay: -12s;
            font-size: 74px;
        }

        .cloud.three {
            top: 72px;
            left: -120px;
            animation-duration: 52s;
            animation-delay: -26s;
        }

        @keyframes cloudDrift {
            from {
                transform: translateX(-120px);
            }
            to {
                transform: translateX(calc(100vw + 240px));
            }
        }

        .hill {
            position: absolute;
            left: -8vw;
            bottom: -96px;
            width: 116vw;
            height: 220px;
            border-radius: 50% 50% 0 0;
            background: #3aa75a;
            opacity: 0.65;
            pointer-events: none;
        }

        .hill.back {
            bottom: -46px;
            left: 22vw;
            width: 92vw;
            height: 184px;
            background: #62c06a;
            opacity: 0.72;
        }

        .flower {
            position: absolute;
            bottom: 20px;
            font-size: 32px;
            animation: flowerDance 2.4s ease-in-out infinite alternate;
            pointer-events: none;
        }

        .flower.one {
            left: 9vw;
        }

        .flower.two {
            left: 28vw;
            animation-delay: -0.8s;
        }

        .flower.three {
            right: 25vw;
            animation-delay: -1.2s;
        }

        .flower.four {
            right: 8vw;
            animation-delay: -0.4s;
        }

        @keyframes flowerDance {
            from {
                transform: rotate(-4deg) translateY(0);
            }
            to {
                transform: rotate(4deg) translateY(-4px);
            }
        }

        .hud {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 150px;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .title-panel,
        .score-panel,
        .timer-panel {
            background: rgba(255, 255, 255, 0.92);
            border: 3px solid rgba(255, 255, 255, 0.85);
            border-radius: 18px;
            box-shadow: 0 8px 20px rgba(63, 114, 133, 0.2);
        }

        .title-panel {
            padding: 12px 18px;
        }

        h1 {
            margin: 0;
            color: #e6417b;
            font-size: 2.1em;
            line-height: 1.1;
        }

        .score-panel,
        .timer-panel {
            min-width: 136px;
            padding: 9px 16px;
            text-align: center;
            font-size: 1.3em;
            font-weight: bold;
        }

        .score-panel strong,
        .timer-panel strong {
            display: block;
            margin-top: 2px;
            font-size: 1.55em;
            line-height: 1;
        }

        .score-panel strong {
            color: #2d9a69;
        }

        .timer-panel strong {
            color: #2c73d2;
        }

        .timer-panel small {
            margin-left: 2px;
            font-size: 0.58em;
        }

        .heart-row {
            position: absolute;
            left: 24px;
            top: 118px;
            z-index: 18;
            display: flex;
            gap: 8px;
            font-size: 31px;
            filter: drop-shadow(0 4px 4px rgba(41, 65, 80, 0.16));
            pointer-events: none;
        }

        .heart-row span {
            opacity: 0.35;
            transform: scale(0.9);
            transition: transform 0.2s, opacity 0.2s;
        }

        .heart-row span.filled {
            opacity: 1;
            transform: scale(1.08);
        }

        .play-area {
            position: absolute;
            inset: 140px 0 0 0;
            overflow: hidden;
        }

        .cat-button {
            position: absolute;
            width: 184px;
            height: 196px;
            border: 0;
            padding: 0;
            background: transparent;
            cursor: pointer;
            z-index: 10;
            -webkit-tap-highlight-color: transparent;
            transition-property: left, top, transform;
            transition-timing-function: cubic-bezier(.24, .78, .33, 1.08);
        }

        .cat-button:hover .cat-sprite,
        .cat-button:hover .character-image {
            transform: translateY(-5px) scale(1.03);
        }

        .cat-button:active .cat-sprite,
        .cat-button.caught .cat-sprite,
        .cat-button:active .character-image,
        .cat-button.caught .character-image {
            transform: scale(0.94) rotate(-4deg);
        }

        .cat-button.facing-left .cat-sprite,
        .cat-button.facing-left .character-image {
            transform: scaleX(-1);
        }

        .cat-button.facing-left:hover .cat-sprite,
        .cat-button.facing-left:hover .character-image {
            transform: scaleX(-1) translateY(-5px) scale(1.03);
        }

        .cat-sprite {
            position: absolute;
            left: 14px;
            top: 6px;
            width: 156px;
            height: 178px;
            transform-origin: 50% 72%;
            transition: transform 0.14s ease;
            animation: kittyBob 0.92s ease-in-out infinite alternate;
            filter: drop-shadow(0 13px 13px rgba(47, 88, 80, 0.22));
        }

        .character-image {
            position: absolute;
            inset: 0;
            display: none;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            transform-origin: 50% 72%;
            transition: transform 0.14s ease;
            animation: kittyBob 0.92s ease-in-out infinite alternate;
            filter: drop-shadow(0 13px 13px rgba(47, 88, 80, 0.22));
            pointer-events: none;
        }

        .cat-button.has-custom-image .character-image {
            display: block;
        }

        .cat-button.has-custom-image .cat-sprite {
            display: none;
        }

        @keyframes kittyBob {
            from {
                margin-top: 0;
            }
            to {
                margin-top: -8px;
            }
        }

        .tail {
            position: absolute;
            right: 4px;
            bottom: 25px;
            width: 58px;
            height: 80px;
            border: 18px solid #fffaf3;
            border-left-color: transparent;
            border-bottom-color: transparent;
            border-radius: 50%;
            transform: rotate(34deg);
            box-shadow: inset -3px 4px 0 #f1dccb, 0 4px 0 rgba(180, 134, 93, 0.08);
        }

        .body {
            position: absolute;
            left: 40px;
            bottom: 12px;
            width: 82px;
            height: 82px;
            border-radius: 45% 45% 42% 42%;
            background: #fffaf3;
            border: 5px solid #e9d5c5;
        }

        .paw {
            position: absolute;
            bottom: 4px;
            width: 28px;
            height: 22px;
            border-radius: 50%;
            background: #fffaf3;
            border: 4px solid #e9d5c5;
        }

        .paw.left {
            left: 48px;
        }

        .paw.right {
            right: 44px;
        }

        .head {
            position: absolute;
            left: 18px;
            top: 28px;
            width: 120px;
            height: 106px;
            border-radius: 48% 48% 46% 46%;
            background: #fffaf3;
            border: 5px solid #e9d5c5;
        }

        .ear {
            position: absolute;
            top: 9px;
            width: 42px;
            height: 46px;
            background: #fffaf3;
            border: 5px solid #e9d5c5;
            transform: rotate(45deg);
            border-radius: 9px 8px 4px 8px;
        }

        .ear::after {
            content: "";
            position: absolute;
            inset: 10px;
            border-radius: 5px;
            background: #ffd6dd;
        }

        .ear.left {
            left: 23px;
        }

        .ear.right {
            right: 23px;
        }

        .eye {
            position: absolute;
            top: 45px;
            width: 12px;
            height: 17px;
            border-radius: 50%;
            background: #273042;
        }

        .eye.left {
            left: 35px;
        }

        .eye.right {
            right: 35px;
        }

        .nose {
            position: absolute;
            left: 50%;
            top: 66px;
            width: 12px;
            height: 9px;
            border-radius: 50%;
            background: #ff8cad;
            transform: translateX(-50%);
        }

        .mouth {
            position: absolute;
            left: 50%;
            top: 77px;
            width: 34px;
            height: 15px;
            border-bottom: 4px solid #a66b67;
            border-radius: 0 0 28px 28px;
            transform: translateX(-50%);
        }

        .whisker {
            position: absolute;
            width: 28px;
            height: 3px;
            border-radius: 999px;
            background: #9b8a84;
        }

        .whisker.left.one {
            left: 7px;
            top: 65px;
            transform: rotate(8deg);
        }

        .whisker.left.two {
            left: 7px;
            top: 78px;
            transform: rotate(-8deg);
        }

        .whisker.right.one {
            right: 7px;
            top: 65px;
            transform: rotate(-8deg);
        }

        .whisker.right.two {
            right: 7px;
            top: 78px;
            transform: rotate(8deg);
        }

        .bow {
            position: absolute;
            right: -10px;
            top: -12px;
            width: 46px;
            height: 34px;
            z-index: 2;
        }

        .bow::before,
        .bow::after {
            content: "";
            position: absolute;
            top: 4px;
            width: 24px;
            height: 25px;
            border-radius: 50% 42% 50% 42%;
            background: #ef3f7b;
            border: 4px solid #c81f5a;
        }

        .bow::before {
            left: 0;
            transform: rotate(-24deg);
        }

        .bow::after {
            right: 0;
            transform: rotate(24deg);
        }

        .bow-knot {
            position: absolute;
            left: 17px;
            top: 12px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ffd1df;
            border: 3px solid #c81f5a;
            z-index: 3;
        }

        .collar {
            position: absolute;
            left: 54px;
            bottom: 80px;
            width: 50px;
            height: 18px;
            border-radius: 999px;
            background: #35b89f;
            border: 4px solid #18836f;
        }

        .bell {
            position: absolute;
            left: 71px;
            bottom: 72px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ffd454;
            border: 3px solid #d69424;
        }

        .message-bubble {
            position: absolute;
            left: 50%;
            top: 105px;
            z-index: 22;
            min-width: 240px;
            padding: 12px 22px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.94);
            box-shadow: 0 8px 22px rgba(50, 88, 98, 0.22);
            color: #e6417b;
            font-size: 1.45em;
            font-weight: bold;
            text-align: center;
            transform: translateX(-50%) scale(0.94);
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            pointer-events: none;
        }

        .message-bubble.show {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        .overlay {
            position: absolute;
            inset: 0;
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(82, 182, 220, 0.2);
            backdrop-filter: blur(3px);
        }

        .dialog {
            width: min(520px, 92vw);
            padding: 32px 34px;
            border-radius: 22px;
            background: #fffef8;
            border: 5px solid #ffffff;
            box-shadow: 0 20px 45px rgba(42, 73, 86, 0.28);
            text-align: center;
        }

        .dialog h2 {
            margin: 0 0 14px 0;
            color: #e6417b;
            font-size: 2.35em;
        }

        .dialog p {
            margin: 8px 0;
            color: #465466;
            font-size: 1.35em;
            line-height: 1.45;
        }

        .primary-btn {
            margin-top: 22px;
            padding: 17px 42px;
            min-width: 190px;
            border: 0;
            border-radius: 16px;
            background: linear-gradient(135deg, #f25a91, #ff855f);
            color: #ffffff;
            font-size: 1.55em;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 0 #bf3c64, 0 14px 24px rgba(191, 60, 100, 0.25);
        }

        .primary-btn:active {
            transform: translateY(5px);
            box-shadow: 0 3px 0 #bf3c64, 0 8px 16px rgba(191, 60, 100, 0.24);
        }

        .float-score,
        .sparkle {
            position: absolute;
            z-index: 35;
            pointer-events: none;
            font-weight: bold;
        }

        .float-score {
            color: #fffaf3;
            text-shadow: 0 3px 0 #e6417b, 0 5px 12px rgba(55, 73, 86, 0.28);
            font-size: 2.7em;
            animation: scorePop 0.82s ease-out forwards;
        }

        @keyframes scorePop {
            0% {
                transform: translate(-50%, -30%) scale(0.4);
                opacity: 0;
            }
            25% {
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -130%) scale(1.25);
                opacity: 0;
            }
        }

        .sparkle {
            font-size: 32px;
            animation: sparkleUp 0.9s ease-out forwards;
        }

        @keyframes sparkleUp {
            from {
                transform: translate(-50%, -50%) scale(0.4) rotate(0deg);
                opacity: 1;
            }
            to {
                transform: translate(var(--x), var(--y)) scale(1.6) rotate(180deg);
                opacity: 0;
            }
        }

        .bonus-rain {
            position: absolute;
            top: -40px;
            z-index: 32;
            font-size: 34px;
            pointer-events: none;
            animation: bonusFall 1.25s ease-in forwards;
        }

        @keyframes bonusFall {
            from {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            to {
                transform: translateY(190px) rotate(140deg);
                opacity: 0;
            }
        }

        @media (max-width: 720px) {
            .sun {
                width: 58px;
                height: 58px;
                right: 18px;
                top: 18px;
            }

            .hud {
                top: 10px;
                left: 10px;
                right: 86px;
                gap: 8px;
            }

            .title-panel {
                padding: 10px 12px;
                flex-basis: 100%;
            }

            h1 {
                font-size: 1.45em;
            }

            .score-panel,
            .timer-panel {
                min-width: 106px;
                padding: 8px 10px;
                font-size: 1em;
            }

            .score-panel strong,
            .timer-panel strong {
                font-size: 1.45em;
            }

            .heart-row {
                top: 126px;
                left: 14px;
                font-size: 24px;
            }

            .message-bubble {
                top: 130px;
                min-width: 202px;
                font-size: 1.15em;
                padding: 10px 16px;
            }

            .play-area {
                inset: 164px 0 0 0;
            }

            .cat-button {
                width: 152px;
                height: 164px;
            }

            .cat-sprite {
                left: 6px;
                top: 2px;
                transform: scale(0.86);
                transform-origin: top left;
            }

            .cat-button:hover .cat-sprite,
            .cat-button:active .cat-sprite,
            .cat-button.caught .cat-sprite {
                transform: scale(0.82) rotate(-4deg);
            }

            .cat-button.facing-left .cat-sprite {
                transform: scaleX(-1) scale(0.86);
            }

            .cat-button.facing-left:hover .cat-sprite {
                transform: scaleX(-1) scale(0.82) translateY(-4px);
            }

            .dialog {
                padding: 26px 22px;
            }

            .dialog h2 {
                font-size: 1.9em;
            }

            .dialog p {
                font-size: 1.15em;
            }
        }
    </style>
</head>
<body>
    <div class="game-container" id="gameContainer">
        <div class="sun"></div>
        <div class="cloud one">☁️</div>
        <div class="cloud two">☁️</div>
        <div class="cloud three">☁️</div>
        <div class="hill back"></div>
        <div class="hill"></div>
        <div class="flower one">🌷</div>
        <div class="flower two">🌼</div>
        <div class="flower three">🌸</div>
        <div class="flower four">🌻</div>

        <div class="hud">
            <div class="title-panel">
                <h1>リボンこねこタッチ</h1>
            </div>
            <div class="score-panel">
                てんすう
                <strong id="score">0</strong>
            </div>
            <div class="timer-panel">
                のこり
                <strong><span id="timer">45</span><small>びょう</small></strong>
            </div>
        </div>

        <div class="heart-row" id="heartRow">
            <span>💗</span>
            <span>💗</span>
            <span>💗</span>
            <span>💗</span>
            <span>💗</span>
        </div>

        <div class="message-bubble" id="messageBubble">みつけた！</div>

        <div class="play-area" id="playArea">
            <button class="cat-button" id="catButton" aria-label="リボンこねこをタッチ">
                <img class="character-image" id="characterImage" alt="" aria-hidden="true">
                <span class="cat-sprite" aria-hidden="true">
                    <span class="tail"></span>
                    <span class="body"></span>
                    <span class="paw left"></span>
                    <span class="paw right"></span>
                    <span class="ear left"></span>
                    <span class="ear right"></span>
                    <span class="head">
                        <span class="bow"><span class="bow-knot"></span></span>
                        <span class="eye left"></span>
                        <span class="eye right"></span>
                        <span class="nose"></span>
                        <span class="mouth"></span>
                        <span class="whisker left one"></span>
                        <span class="whisker left two"></span>
                        <span class="whisker right one"></span>
                        <span class="whisker right two"></span>
                    </span>
                    <span class="collar"></span>
                    <span class="bell"></span>
                </span>
            </button>
        </div>

        <div class="overlay" id="startOverlay">
            <div class="dialog">
                <h2>こねこを タッチ！</h2>
                <p>ぴょこぴょこ うごく</p>
                <p>しろい こねこを みつけてね</p>
                <button class="primary-btn" id="startButton">スタート！</button>
            </div>
        </div>

        <div class="overlay" id="endOverlay" style="display: none;">
            <div class="dialog">
                <h2>よくできました！</h2>
                <p><span id="finalScore">0</span>てん とれたよ</p>
                <p id="finalMessage">また いっしょに あそぼうね</p>
                <button class="primary-btn" id="retryButton">もういちど！</button>
            </div>
        </div>
    </div>

    <script>
        const gameContainer = document.getElementById('gameContainer');
        const playArea = document.getElementById('playArea');
        const catButton = document.getElementById('catButton');
        const scoreEl = document.getElementById('score');
        const timerEl = document.getElementById('timer');
        const startOverlay = document.getElementById('startOverlay');
        const endOverlay = document.getElementById('endOverlay');
        const startButton = document.getElementById('startButton');
        const retryButton = document.getElementById('retryButton');
        const finalScoreEl = document.getElementById('finalScore');
        const finalMessageEl = document.getElementById('finalMessage');
        const messageBubble = document.getElementById('messageBubble');
        const heartRow = document.getElementById('heartRow');
        const characterImage = document.getElementById('characterImage');

        const customCharacterImages = [
            'character.png',
            'character.webp',
            'character.jpg',
            'character.jpeg'
        ];

        const cheerMessages = [
            'みつけた！',
            'いいね！',
            'すごい！',
            'やったね！',
            'じょうず！',
            'にゃん！'
        ];

        let score = 0;
        let timeLeft = 45;
        let gameActive = false;
        let timerInterval = null;
        let moveTimeout = null;
        let audioContext = null;
        let lastPosition = { x: 0, y: 0 };
        let lastTapAt = 0;

        function loadCustomCharacterImage(index) {
            if (index >= customCharacterImages.length) return;

            const image = new Image();
            image.onload = () => {
                characterImage.src = customCharacterImages[index];
                catButton.classList.add('has-custom-image');
            };
            image.onerror = () => loadCustomCharacterImage(index + 1);
            image.src = customCharacterImages[index];
        }

        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playTone(frequency, startOffset, duration, type, volume) {
            if (!audioContext) return;

            const oscillator = audioContext.createOscillator();
            const gain = audioContext.createGain();
            const startTime = audioContext.currentTime + startOffset;

            oscillator.type = type;
            oscillator.frequency.setValueAtTime(frequency, startTime);
            gain.gain.setValueAtTime(volume, startTime);
            gain.gain.exponentialRampToValueAtTime(0.01, startTime + duration);

            oscillator.connect(gain);
            gain.connect(audioContext.destination);
            oscillator.start(startTime);
            oscillator.stop(startTime + duration);
        }

        function playTapSound() {
            playTone(740, 0, 0.12, 'sine', 0.22);
            playTone(1040, 0.06, 0.16, 'triangle', 0.14);
        }

        function playBonusSound() {
            [660, 820, 980, 1320].forEach((frequency, index) => {
                playTone(frequency, index * 0.08, 0.18, 'sine', 0.17);
            });
        }

        function playFinishSound() {
            [523, 659, 784, 1046].forEach((frequency, index) => {
                playTone(frequency, index * 0.11, 0.24, 'triangle', 0.16);
            });
        }

        function randomBetween(min, max) {
            return min + Math.random() * (max - min);
        }

        function moveCat(immediate) {
            const areaWidth = playArea.clientWidth;
            const areaHeight = playArea.clientHeight;
            const catWidth = catButton.offsetWidth;
            const catHeight = catButton.offsetHeight;
            const margin = 16;
            const maxX = Math.max(margin, areaWidth - catWidth - margin);
            const maxY = Math.max(margin, areaHeight - catHeight - margin);
            let nextX = randomBetween(margin, maxX);
            let nextY = randomBetween(margin, maxY);

            for (let i = 0; i < 8; i++) {
                const farEnough = Math.abs(nextX - lastPosition.x) > catWidth * 0.62 ||
                    Math.abs(nextY - lastPosition.y) > catHeight * 0.5;
                if (farEnough) break;
                nextX = randomBetween(margin, maxX);
                nextY = randomBetween(margin, maxY);
            }

            catButton.classList.toggle('facing-left', nextX < lastPosition.x);
            const duration = immediate ? 0 : Math.max(980, 1550 - Math.min(score, 18) * 26);
            catButton.style.transitionDuration = duration + 'ms';
            catButton.style.left = nextX + 'px';
            catButton.style.top = nextY + 'px';
            lastPosition = { x: nextX, y: nextY };
        }

        function scheduleMove() {
            clearTimeout(moveTimeout);
            if (!gameActive) return;

            const wait = Math.max(900, 1500 - Math.min(score, 16) * 22) + Math.random() * 420;
            moveTimeout = setTimeout(() => {
                moveCat(false);
                scheduleMove();
            }, wait);
        }

        function updateHearts() {
            const hearts = Array.from(heartRow.children);
            const filledCount = score % 5 === 0 && score > 0 ? 5 : score % 5;

            hearts.forEach((heart, index) => {
                heart.classList.toggle('filled', index < filledCount);
            });
        }

        function showMessage(text) {
            messageBubble.textContent = text;
            messageBubble.classList.add('show');
            clearTimeout(messageBubble.hideTimeout);
            messageBubble.hideTimeout = setTimeout(() => {
                messageBubble.classList.remove('show');
            }, 760);
        }

        function createFloatingScore(x, y) {
            const scoreNode = document.createElement('div');
            scoreNode.className = 'float-score';
            scoreNode.textContent = '+1';
            scoreNode.style.left = x + 'px';
            scoreNode.style.top = y + 'px';
            gameContainer.appendChild(scoreNode);

            setTimeout(() => scoreNode.remove(), 840);
        }

        function createSparkles(x, y, bonus) {
            const marks = bonus ? ['💗', '⭐', '🎀', '✨', '🌟', '💗', '⭐', '✨'] : ['✨', '💗', '⭐', '✨'];

            marks.forEach((mark, index) => {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.textContent = mark;
                sparkle.style.left = x + 'px';
                sparkle.style.top = y + 'px';
                sparkle.style.setProperty('--x', randomBetween(-115, 115) + 'px');
                sparkle.style.setProperty('--y', randomBetween(-128, -46) + 'px');
                sparkle.style.animationDelay = index * 0.025 + 's';
                gameContainer.appendChild(sparkle);

                setTimeout(() => sparkle.remove(), 1000);
            });
        }

        function createBonusRain() {
            for (let i = 0; i < 12; i++) {
                const bonus = document.createElement('div');
                bonus.className = 'bonus-rain';
                bonus.textContent = i % 3 === 0 ? '🎀' : i % 3 === 1 ? '⭐' : '💗';
                bonus.style.left = randomBetween(8, 92) + 'vw';
                bonus.style.animationDelay = i * 0.045 + 's';
                gameContainer.appendChild(bonus);

                setTimeout(() => bonus.remove(), 1500);
            }
        }

        function handleCatTap(event) {
            event.preventDefault();
            if (!gameActive) return;

            const now = Date.now();
            if (now - lastTapAt < 180) return;
            lastTapAt = now;

            const rect = catButton.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            score++;
            scoreEl.textContent = score;
            updateHearts();
            playTapSound();
            createFloatingScore(centerX, centerY);
            createSparkles(centerX, centerY, score % 5 === 0);
            showMessage(cheerMessages[score % cheerMessages.length]);

            catButton.classList.add('caught');
            setTimeout(() => catButton.classList.remove('caught'), 180);

            if (score % 5 === 0) {
                playBonusSound();
                createBonusRain();
                showMessage('5てん すごい！');
            }

            if (navigator.vibrate) {
                navigator.vibrate(24);
            }

            setTimeout(() => {
                if (gameActive) {
                    moveCat(false);
                    scheduleMove();
                }
            }, 210);
        }

        function clearParticles() {
            document.querySelectorAll('.float-score, .sparkle, .bonus-rain').forEach(node => node.remove());
        }

        function startGame() {
            initAudio();
            score = 0;
            timeLeft = 45;
            gameActive = true;
            lastTapAt = 0;
            scoreEl.textContent = score;
            timerEl.textContent = timeLeft;
            updateHearts();
            clearParticles();
            startOverlay.style.display = 'none';
            endOverlay.style.display = 'none';

            moveCat(true);
            setTimeout(() => moveCat(false), 80);
            scheduleMove();

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                timerEl.textContent = timeLeft;

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            gameActive = false;
            clearInterval(timerInterval);
            clearTimeout(moveTimeout);
            messageBubble.classList.remove('show');
            finalScoreEl.textContent = score;
            finalMessageEl.textContent = score >= 20 ? 'こねこと なかよしだね！' : 'いっぱい タッチできたね！';
            endOverlay.style.display = 'flex';
            playFinishSound();
            createBonusRain();
        }

        startButton.addEventListener('click', startGame);
        retryButton.addEventListener('click', startGame);
        catButton.addEventListener('pointerdown', handleCatTap);

        window.addEventListener('resize', () => {
            if (gameActive) {
                moveCat(true);
                scheduleMove();
            }
        });

        loadCustomCharacterImage(0);
        moveCat(true);
    </script>
</body>
</html>
